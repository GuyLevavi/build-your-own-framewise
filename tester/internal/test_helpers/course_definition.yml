---
# Layout and field meanings follow codecrafters-io/build-your-own-http-server (MIT, see LICENSE).
slug: "framewise"
name: "Build your own Framewise"
short_name: "Framewise"
release_status: "alpha"

description_md: |-
  Framewise is a small video analytics service: it takes recorded video, runs a detector we hand
  you as a black box, and serves what appeared and when over HTTP. In this challenge you'll grow
  it from an empty `main.py` into a service with a Postgres job queue, several workers that
  survive crashes, results you can query, and a pipeline, an image and a Helm chart that ship it.

  Along the way you'll learn about streaming data, YAML config, FastAPI, Postgres and Alembic,
  `SKIP LOCKED` queues, signals, SQL over results, calling a model server, structured logs,
  GitLab CI, container images, Helm and GitOps. No computer vision background is needed: the
  model is a black box with a written contract, and every stage has hints.

short_description_md: |-
  Learn about job queues, Postgres, workers, model servers and shipping a service

completion_percentage: 30

languages:
  - slug: "python"

marketing:
  difficulty: medium
  sample_extension_idea_title: "A real model"
  sample_extension_idea_description: "Run the models on GPUs on a real Triton behind the same job API"
  testimonials: []

stages:
  # Probe a video
  - slug: "pb1"
    name: "Probe a video"
    difficulty: very_easy
    marketing_md: |-
      In this stage, you'll open a video with OpenCV and print its size, frame rate and length as JSON.

  - slug: "pb2"
    name: "Fail cleanly"
    difficulty: easy
    marketing_md: |-
      In this stage, you'll make missing and broken files fail with one clear line, not a traceback.

  # Analyze
  - slug: "an1"
    name: "Analyze a clip"
    difficulty: medium
    marketing_md: |-
      In this stage, you'll run the shipped .onnx detector on sampled frames and report when each label appears.

  - slug: "an2"
    name: "Analyze a long clip"
    difficulty: easy
    marketing_md: |-
      In this stage, you'll analyze ten minutes of video under a memory budget.

  - slug: "an3"
    name: "Profiles in YAML"
    difficulty: medium
    marketing_md: |-
      In this stage, you'll load named analysis profiles from YAML and reject bad ones precisely.

  # Serve
  - slug: "ap1"
    name: "Upload a video"
    difficulty: medium
    marketing_md: |-
      In this stage, you'll serve an HTTP API that takes uploads as a stream, with size and type limits.

  - slug: "ap2"
    name: "Run jobs"
    difficulty: medium
    marketing_md: |-
      In this stage, you'll run analysis jobs in the background and report their status and errors.

  - slug: "ap3"
    name: "Survive a restart"
    difficulty: hard
    marketing_md: |-
      In this stage, you'll keep videos and jobs in Postgres, so a restart loses nothing.

  # Work
  - slug: "wk1"
    name: "Run workers"
    difficulty: hard
    marketing_md: |-
      In this stage, you'll move job execution into `work` processes that share one Postgres queue without two of them taking the same job.

  - slug: "wk2"
    name: "Crashed workers"
    difficulty: hard
    marketing_md: |-
      In this stage, you'll give claims a lease so a job outlives the worker that died running it.

  - slug: "wk3"
    name: "Stop gracefully"
    difficulty: medium
    marketing_md: |-
      In this stage, you'll make a worker stop cleanly on SIGTERM and hand its job back.

  # Results
  - slug: "rs1"
    name: "Store detections"
    difficulty: medium
    marketing_md: |-
      In this stage, you'll store every box in Postgres and serve a time range of them, through an index.

  - slug: "rs2"
    name: "Events in SQL"
    difficulty: hard
    marketing_md: |-
      In this stage, you'll find events (a person crossing a car) with a gaps-and-islands query.

  - slug: "rs3"
    name: "Retries without duplicates"
    difficulty: medium
    marketing_md: |-
      In this stage, you'll make a retried or rerun job store its results exactly once, detections and episodes alike.

  # Call a model server
  - slug: "md1"
    name: "Call a model server"
    difficulty: medium
    marketing_md: |-
      In this stage, you'll run the detector on a model server that speaks Triton's HTTP protocol, chosen by a profile setting.

  - slug: "md2"
    name: "Send batches"
    difficulty: medium
    marketing_md: |-
      In this stage, you'll send frames to the model server in batches, without reading the whole video ahead.

  - slug: "md3"
    name: "When the model server fails"
    difficulty: medium
    marketing_md: |-
      In this stage, you'll set timeouts, retry what's worth retrying, and fail a job clearly when the model server can't help.

  # Operate
  - slug: "op1"
    name: "Logs and readiness"
    difficulty: medium
    marketing_md: |-
      In this stage, you'll write structured logs a log platform can search, report each job's frames per second, and tell Kubernetes when the API is ready.

  - slug: "hd1"
    name: "API keys"
    difficulty: easy
    marketing_md: |-
      In this stage, you'll protect the API with a key, compared the way secrets should be.

  # Ship it: CI, image, pod and chart, checked on this machine with podman, helm and git
  - slug: "ci1"
    name: "Gate merges"
    difficulty: medium
    marketing_md: |-
      In this stage, you'll write the GitLab pipeline that stops a broken merge request.

  - slug: "im1"
    name: "Build an image"
    difficulty: medium
    marketing_md: |-
      In this stage, you'll package the service as one small image that runs as any user.

  - slug: "im2"
    name: "Run the pod"
    difficulty: medium
    marketing_md: |-
      In this stage, you'll run the API, a worker and Postgres together with podman kube play.

  - slug: "hm1"
    name: "Chart it"
    difficulty: hard
    marketing_md: |-
      In this stage, you'll write the Helm chart that runs Framewise in OpenShift.
