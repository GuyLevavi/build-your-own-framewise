# The course's own pipeline. Merge requests get the quick checks; the full proof that every
# stage is sound (verify_course.sh: solution N passes 1..N, solution N-1 fails stage N) runs when
# solutions, stages or tools change, and on a schedule.
#
# Project variables (Settings > CI/CD > Variables):
#   CI_IMAGE         an image with bash, git, diffutils and python3 (the uv CI image will do)
#   GO_IMAGE         a Go 1.24 image in the registry, for the tester's jobs
#   GOPROXY          the Go module mirror the network allows (or set GOFLAGS=-mod=vendor after
#                    committing `go mod vendor` in tester/)
#   FRAMEWISE_TEST_DATABASE_URL  optional: a Postgres the tester may create databases on;
#                    unset, the tester starts its own with podman
# The verify job needs a runner tagged `podman`: a shell executor on a machine like the learners'
# workstation, with podman, helm, git, go and the course images loaded (postgres:18 and
# ghcr.io/astral-sh/uv:python3.12-bookworm-slim, from the airgap tarball).

stages: [check, verify]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"

generated-files:
  stage: check
  image: ${CI_IMAGE}
  script:
    # compile.sh derives the starter, the solutions' boilerplate and the diffs; a merge request
    # that changes a source without running it leaves them stale.
    - tools/compile.sh
    - git diff --exit-code --stat || (echo "Run tools/compile.sh and commit the result" && exit 1)

scripts:
  stage: check
  image: ${CI_IMAGE}
  script:
    - for f in tools/*.sh; do bash -n "$f"; done
    # The reviewer's brief must render for every stage.
    - for s in $(awk '/^stages:/{s=1} s && /^  - slug:/{gsub(/"/,"",$3); print $3}' course-definition.yml); do python3 tools/brief.py "$s" >/dev/null; done
    # One stage text and one reference solution per stage in course-definition.yml.
    - stages=$(awk '/^stages:/{s=1} s && /^  - slug:/' course-definition.yml | wc -l)
    - test "$stages" = "$(ls stage_descriptions | wc -l)"
    - test "$stages" = "$(ls -d solutions/python/*/ | wc -l)"

# The tester (tester/): formatting, vet, and its unit tests (stages against the course definition,
# clips against the numbers the stage descriptions quote).
.go:
  image: ${GO_IMAGE}
  variables:
    CGO_ENABLED: "0"
    GOTOOLCHAIN: local             # never download a toolchain
    GOPATH: ${CI_PROJECT_DIR}/.go  # inside the project, so the runner can cache modules
    GOCACHE: ${CI_PROJECT_DIR}/.go-build
  cache:
    key:
      files: [tester/go.sum]
    paths: [.go/pkg/mod, .go-build]

tester:
  extends: .go
  stage: check
  script:
    - cd tester
    # The tester's copy of the course definition must be the course's.
    - cmp ../course-definition.yml internal/test_helpers/course_definition.yml || (echo "Run make -C tester copy_course_file and commit the result" && exit 1)
    - test -z "$(gofmt -l cmd internal/*.go)" || (gofmt -l cmd internal/*.go && exit 1)
    - go vet ./...
    - go test -count=1 ./...

verify:
  stage: verify
  tags: [podman]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - changes: [solutions/**/*, stage_descriptions/**/*, course-definition.yml, tools/**/*, dockerfiles/**/*, compiled_starters/**/*, starter_templates/**/*, tester/**/*]
  timeout: 3h
  before_script:
    - make -C tester build
  script:
    - tools/verify_course.sh
  artifacts:
    when: always
    paths: [tools/.verify/]
    expire_in: 2 weeks
