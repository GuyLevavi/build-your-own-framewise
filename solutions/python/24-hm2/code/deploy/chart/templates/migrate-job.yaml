# Applies the schema before Argo CD rolls out new pods: a PreSync hook runs, and must
# succeed, before anything else in the sync. A failed migration stops the release.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate-{{ .Values.image.tag | trunc 12 | trimSuffix "-" }}
  labels: {{- include "framewise.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: {{ include "framewise.image" . }}
          args: [migrate]
          env: {{- include "framewise.env" . | nindent 12 }}
