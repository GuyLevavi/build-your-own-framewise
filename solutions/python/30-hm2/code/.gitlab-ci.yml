# Every merge request runs lint and the tests; a red pipeline blocks the merge.
# On main, the pipeline also builds the image and releases it: it commits the new image tag
# to values-nonprod.yaml, and Argo CD syncs that commit into nonprod.
#
# Project variables (Settings > CI/CD > Variables):
#   CI_IMAGE      the CI job image, with uv and Python 3.12
#   BUILDAH_IMAGE an image with buildah, for building without a privileged container
#   BASE_IMAGE    the Python base image the Containerfile builds on
#   QUAY_IMAGE    where Framewise images go, e.g. quay.example.internal/team/framewise
#   QUAY_ROBOT_USER, QUAY_ROBOT_TOKEN   the Quay robot account (masked)
#   DEPLOY_TOKEN  a project access token that may push to main (masked)
default:
  image: ${CI_IMAGE}
  before_script:
    - uv sync --locked

variables:
  UV_CACHE_DIR: .uv-cache        # inside the project, so the runner can cache it
  UV_LINK_MODE: copy             # the cache and .venv are on different filesystems

cache:
  key:
    files: [uv.lock]             # a new lock file starts a new cache
  paths: [.uv-cache]

stages: [lint, test, build, deploy]

lint:
  stage: lint
  script:
    - uv run ruff check .
    - uv run ruff format --check .

test:
  stage: test
  script:
    - uv run python -m pytest -q tests   # -m puts the project on sys.path, so `import app` works

build:
  stage: build
  image: ${BUILDAH_IMAGE}
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script: []
  cache: []
  script:
    - buildah login -u "$QUAY_ROBOT_USER" -p "$QUAY_ROBOT_TOKEN" "${QUAY_IMAGE%%/*}"
    - buildah bud --build-arg BASE_IMAGE="$BASE_IMAGE" -t "$QUAY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - buildah push "$QUAY_IMAGE:$CI_COMMIT_SHORT_SHA"

deploy:
  stage: deploy
  needs: [build]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script: []
  cache: []
  script:
    # The release is a commit: the new tag in values-nonprod.yaml. [skip ci] keeps this commit
    # from starting another pipeline, which would release again, forever.
    # (Quoted for YAML: an unquoted ": " would make this line a map, not a command.)
    - 'sed -i "s/^  tag:.*/  tag: \"$CI_COMMIT_SHORT_SHA\"/" deploy/chart/values-nonprod.yaml'
    - git config user.name "Framewise CI" && git config user.email "ci@framewise.invalid"
    - git commit -am "Release $CI_COMMIT_SHORT_SHA to nonprod [skip ci]"
    - git push "https://ci:${DEPLOY_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" HEAD:$CI_DEFAULT_BRANCH
